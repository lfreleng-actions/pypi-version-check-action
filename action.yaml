---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2024 The Linux Foundation

# pypi-version-check-action
name: "📦 PyPI Package Check"
description: "Checks PyPI for a given package (and optional build/release)"

inputs:
  # Mandatory
  PACKAGE_NAME:
    description: "Python package name"
    required: true
  # Optional
  PACKAGE_VERSION:
    # Leading "v" character will be automatically stripped
    description: "Package build/version/tag"
    required: false
  INDEX_URL:
    description: "Package index search URL"
    required: false
    default: 'https://pypi.org/simple'
  PRE_RELEASE:
    description: "Permit querying development and pre-release versions"
    required: false
    default: 'false'
  EXIT_ON_FAIL:
    description: "Exit with error on failure"
    required: false
    default: 'false'

outputs:
  PACKAGE_MATCH:
    description: "Set true when package exists in index"
    value: ${{ steps.check.outputs.package_match }}
  VERSION_MATCH:
    description: "Set true when web package/version exists"
    value: ${{ steps.check.outputs.version_match }}

runs:
  using: "composite"
  steps:
    - name: "Check pip installed/available"
      id: pip
      shell: bash
      env:
        ACTION_PATH: "${{ github.action_path }}"
        RUN_PIP: "${{ github.action_path }}/scripts/run_pip.py"
        PYTHONPATH_FILTER: >-
          ${{ github.action_path }}/scripts/trusted_pythonpath.py
        # Where pip may fall back to a user install when the caller's
        # user site is in the workspace; shared by both steps.
        FALLBACK_USER_BASE: >-
          ${{ runner.temp }}/pypi-version-check-action/user-base
      run: |
        # Check pip installed/available
        # On macOS, PYTHONEXECUTABLE and __PYVENV_LAUNCHER__ tell Python
        # where it was started from, and it reads them even under -I: a
        # pyvenv.cfg beside the place they name makes that a virtual
        # environment, whose home, standard library and site-packages
        # could then be in the workspace. A pip query needs neither, so
        # both are dropped before any Python starts.
        unset PYTHONEXECUTABLE __PYVENV_LAUNCHER__
        # The working directory is the caller's workspace. 'python3 -m'
        # would put it first on sys.path, so a pip/ there would run in
        # place of the installed pip; run_pip.py starts pip without it.
        # The working directory itself is kept, so relative paths in
        # pip's own settings still resolve.
        #
        # Choose python3 from PATH, skipping relative entries and any
        # that reach the workspace: an interpreter there (a .venv/bin in
        # the checkout) would run its site-packages' .pth and
        # sitecustomize files before pip starts. Every directory on the
        # way counts, as written (Python looks for pyvenv.cfg beside
        # and above the path it was started by, before resolving links)
        # and through each symlink to the file. Links are read with the
        # system's own readlink (command -p searches only the standard
        # system directories, not PATH), and a path that cannot be
        # resolved counts as reaching the workspace. The PATH entries
        # that pass are the PATH both steps use from then on.
        real_dir() { (cd -P "$1" 2> /dev/null && pwd -P); }
        roots=()
        for root in "$PWD" "${GITHUB_WORKSPACE:-}"; do
          real="$(real_dir "$root")" && [ -n "$real" ] && roots+=("$real")
        done
        dirs_reach_workspace() {
          local rest="${1%/*}" prefix="" part real root
          while [ -n "$rest" ]; do
            part="${rest%%/*}"
            case "$rest" in */*) rest="${rest#*/}" ;; *) rest="" ;; esac
            [ -n "$part" ] || continue
            prefix="$prefix/$part"
            real="$(real_dir "$prefix")" || return 0
            for root in "${roots[@]}"; do
              case "$real/" in "$root"/*) return 0 ;; esac
            done
          done
          return 1
        }
        # A file, by the directories on the way to it as written and
        # through each link to it.
        path_reaches_workspace() {
          local path="$1" dir target hops=0
          while :; do
            dirs_reach_workspace "$path" && return 0
            dir="$(real_dir "${path%/*}/")" || return 0
            path="$dir/${path##*/}"
            [ -L "$path" ] || return 1
            hops=$((hops + 1))
            [ "$hops" -le 40 ] || return 0
            target="$(command -p readlink "$path")" || return 0
            case "$target" in
              /*) path="$target" ;;
              *) path="$dir/$target" ;;
            esac
          done
        }
        # Python takes its standard library from the 'home' of a
        # pyvenv.cfg beside the interpreter or in the directory above,
        # even under -I -S: by the path it was started by (3.11 and
        # later) or by the file that path leads to (earlier releases).
        # A venv outside the workspace can name a home inside it, so a
        # home that is relative, or that reaches the workspace, itself
        # or through the standard-library directories Python looks for
        # beside and below it, rules the interpreter out.
        venv_home_reaches_workspace() {
          local dir="${1%/*}" cfg home prefix lib entry
          for cfg in "${dir%/*}/pyvenv.cfg" "$dir/pyvenv.cfg"; do
            [ -f "$cfg" ] || continue
            home="$(command -p sed -n \
              's/^[[:space:]]*[Hh][Oo][Mm][Ee][[:space:]]*=[[:space:]]*//p' \
              "$cfg" | command -p head -n 1)"
            home="${home%"${home##*[![:space:]]}"}"
            [ -n "$home" ] || continue
            case "$home" in /*) ;; *) return 0 ;; esac
            dirs_reach_workspace "$home/" && return 0
            for prefix in "$home" "${home%/*}"; do
              for lib in "$prefix"/lib "$prefix"/lib64 "$prefix"/Lib \
                "$prefix"/DLLs; do
                [ -e "$lib" ] || continue
                dirs_reach_workspace "$lib/" && return 0
                for entry in "$lib"/python*; do
                  [ -e "$entry" ] || continue
                  if [ -d "$entry" ]; then
                    dirs_reach_workspace "$entry/" && return 0
                    if [ -e "$entry/lib-dynload" ]; then
                      dirs_reach_workspace "$entry/lib-dynload/" && return 0
                    fi
                  else
                    path_reaches_workspace "$entry" && return 0
                  fi
                done
              done
            done
          done
          return 1
        }
        # A script runs the interpreter on its first line, which the
        # kernel takes by path, or env finds by name on PATH; a python3
        # that is a shim outside the workspace could so start a file in
        # it. That interpreter is checked as the candidate is, through
        # scripts it names in turn.
        shebang_depth=0
        shebang_reaches_workspace() {
          local line interp prog dir env_dirs found="" reaches=1
          [ "$(command -p head -c 2 "$1" 2> /dev/null)" = '#!' ] || return 1
          [ "$shebang_depth" -lt 8 ] || return 0
          line="$(command -p head -c 256 "$1" | command -p head -n 1)"
          read -r interp prog _ <<< "${line#"#!"}"
          case "$interp" in /*) ;; *) return 0 ;; esac
          if [ "${interp##*/}" = env ]; then
            case "$prog" in
              "" | -*) return 0 ;;
              /*) found="$prog" ;;
              */*) return 0 ;;
              *)
                IFS=: read -r -a env_dirs <<< "$trusted_path"
                for dir in "${env_dirs[@]}"; do
                  [ -f "$dir/$prog" ] && [ -x "$dir/$prog" ] || continue
                  found="$dir/$prog"
                  break
                done
                [ -n "$found" ] || return 1 ;;
            esac
          else
            found="$interp"
          fi
          shebang_depth=$((shebang_depth + 1))
          reaches_workspace "$found" && reaches=0
          shebang_depth=$((shebang_depth - 1))
          return "$reaches"
        }
        # An interpreter: its path and links, any pyvenv.cfg on the way,
        # and the first line of the file they lead to.
        reaches_workspace() {
          local path="$1" dir target hops=0
          while :; do
            dirs_reach_workspace "$path" && return 0
            venv_home_reaches_workspace "$path" && return 0
            dir="$(real_dir "${path%/*}/")" || return 0
            path="$dir/${path##*/}"
            if [ ! -L "$path" ]; then
              shebang_reaches_workspace "$path" && return 0
              return 1
            fi
            hops=$((hops + 1))
            [ "$hops" -le 40 ] || return 0
            target="$(command -p readlink "$path")" || return 0
            case "$target" in
              /*) path="$target" ;;
              *) path="$dir/$target" ;;
            esac
          done
        }
        # A shim, or env on a script's first line, finds python by name
        # on PATH, so a directory stays on the trusted PATH only when
        # no python* in it reaches the workspace. A name that leads
        # nowhere cannot run, and is passed over.
        pythons_reach_workspace() {
          local entry
          for entry in "$1"/python*; do
            [ -e "$entry" ] || continue
            reaches_workspace "$entry" && return 0
          done
          return 1
        }
        trusted_path=""
        IFS=: read -r -a path_dirs <<< "$PATH"
        for dir in "${path_dirs[@]}"; do
          case "$dir" in /*) ;; *) continue ;; esac
          dirs_reach_workspace "$dir/" && continue
          trusted_path="${trusted_path:+$trusted_path:}$dir"
        done
        # The env lookups above search the directories kept so far.
        kept_path=""
        IFS=: read -r -a path_dirs <<< "$trusted_path"
        for dir in "${path_dirs[@]}"; do
          pythons_reach_workspace "$dir" && continue
          kept_path="${kept_path:+$kept_path:}$dir"
        done
        trusted_path="$kept_path"
        # A shim may choose the interpreter by the working directory
        # (pyenv's .python-version, for one) or by PATH, so each
        # candidate, every python* on the trusted PATH having passed
        # the checks above, is asked where it runs from, in the
        # action's own directory and with the trusted PATH, and that
        # path, checked in turn, is the one both steps run.
        python=""
        IFS=: read -r -a path_dirs <<< "$trusted_path"
        for dir in "${path_dirs[@]}"; do
          candidate="$dir/python3"
          [ -f "$candidate" ] && [ -x "$candidate" ] || continue
          resolved="$(cd "$ACTION_PATH" && PATH="$trusted_path" \
            "$candidate" -I -S -c 'import sys; print(sys.executable)')" ||
            continue
          resolved="${resolved##*$'\n'}"
          case "$resolved" in /*) ;; *) continue ;; esac
          reaches_workspace "$resolved" && continue
          python="$resolved"
          break
        done
        if [ -z "$python" ]; then
          echo "No python3 found on PATH outside the workspace ❌"; exit 1
        fi
        export PATH="$trusted_path"
        echo "python=$python" >> "$GITHUB_OUTPUT"
        echo "path=$trusted_path" >> "$GITHUB_OUTPUT"
        # The ensurepip call below changes directory, so a relative HOME
        # or PYTHONUSERBASE (where pip may fall back to install) is made
        # absolute first, keeping its meaning.
        case "${HOME:-/}" in
          /*) ;;
          *) export HOME="$PWD/$HOME" ;;
        esac
        case "${PYTHONUSERBASE:-/}" in
          /*) ;;
          *) export PYTHONUSERBASE="$PWD/$PYTHONUSERBASE" ;;
        esac
        # PYTHONPATH is not passed to pip's interpreter: entries there
        # come before the standard library and are searched for a
        # sitecustomize module at start-up, so one linking into the
        # checkout would run. The entries that are absolute and neither
        # in nor above the workspace, such as a pip installed with
        # --target, go to run_pip.py in ACTION_PYTHONPATH instead, which
        # puts them after the standard library. A user site inside or
        # above the workspace, whose .pth files Python runs at start-up,
        # moves to FALLBACK_USER_BASE, which both steps share, so pip can
        # still fall back to a user install. PYTHONHOME and
        # PYTHONPLATLIBDIR are unset: the probe above ran the interpreter
        # with -I, which ignores both, so it finds its own standard
        # library without them, and a home's contents could not be
        # checked file by file. PYTHONPYCACHEPREFIX reaching the
        # workspace would have cached bytecode there stand in for
        # modules' own, so it is unset too.
        # The filter runs with -I -S: no workspace module and no .pth
        # file can change what it prints. Assigned before eval, so a
        # failure stops the step.
        settings="$("$python" -I -S "$PYTHONPATH_FILTER")"
        eval "$settings"
        # With those settings, Python finds its prefix as it will for
        # pip; -S stops any .pth file running while the filter checks
        # that none of the interpreter's own site-packages directories
        # (a venv's linked into the checkout, say), no .pth file there
        # or path one adds (an editable install of the checkout), and no
        # sitecustomize or usercustomize there, lies in or above the
        # workspace.
        if ! "$python" -S "$PYTHONPATH_FILTER" --check-site; then
          echo "python3 loads site-packages from the workspace ❌"; exit 1
        fi
        # Probe pip through the interpreter the next step runs it with;
        # ensurepip does not guarantee a bare "pip" command on PATH
        if ! "$python" "$RUN_PIP" --version > /dev/null 2>&1; then
          # ensurepip runs pip in a second interpreter started with -c,
          # which puts its working directory first on sys.path, so run
          # it from the action's own directory. -I would also do that,
          # but it hides the user site from that pip, which then cannot
          # fall back to a user install when site-packages is read-only.
          # ensurepip ignores pip's settings, so the move changes nothing
          # else.
          if ! (cd "$ACTION_PATH" &&
            "$python" -m ensurepip --upgrade > /dev/null); then
            echo "Unable to find/install pip command ❌"
            echo "Check instance type and OS environment"; exit 1
          fi
          echo "Successfully installed pip ✅"
          # The pip that runs may still be another: one ahead of the
          # install on ACTION_PYTHONPATH that run_pip.py refuses, say.
          # Stop here, with its reason, rather than let the query report
          # no package.
          if ! "$python" "$RUN_PIP" --version > /dev/null; then
            echo "The installed pip is not the pip that runs ❌"
            echo "Check PYTHONPATH and the interpreter's site-packages"
            exit 1
          fi
        fi

    - name: "Check Python package index"
      id: check
      shell: bash
      env:
        PYTHON: "${{ steps.pip.outputs.python }}"
        TRUSTED_PATH: "${{ steps.pip.outputs.path }}"
        RUN_PIP: "${{ github.action_path }}/scripts/run_pip.py"
        PYTHONPATH_FILTER: >-
          ${{ github.action_path }}/scripts/trusted_pythonpath.py
        FALLBACK_USER_BASE: >-
          ${{ runner.temp }}/pypi-version-check-action/user-base
        INPUT_INDEX_URL: "${{ inputs.INDEX_URL }}"
        INPUT_PACKAGE_NAME: "${{ inputs.PACKAGE_NAME }}"
        INPUT_PACKAGE_VERSION: "${{ inputs.PACKAGE_VERSION }}"
        INPUT_PRE_RELEASE: "${{ inputs.PRE_RELEASE }}"
        INPUT_EXIT_ON_FAIL: "${{ inputs.EXIT_ON_FAIL }}"
      run: |
        # Check Python package index
        # As in the step above
        unset PYTHONEXECUTABLE __PYVENV_LAUNCHER__
        export PATH="$TRUSTED_PATH"
        # Text tools come from the system's own directories (command -p),
        # not PATH, which may lead into the workspace.
        INDEX_URL="$INPUT_INDEX_URL"
        PACKAGE_NAME="$INPUT_PACKAGE_NAME"
        PACKAGE_VERSION="$INPUT_PACKAGE_VERSION"
        PRE_RELEASE=$(printf '%s' "$INPUT_PRE_RELEASE" |\
        command -p tr '[:upper:]' '[:lower:]')
        EXIT_ON_FAIL=$(printf '%s' "$INPUT_EXIT_ON_FAIL" |\
          command -p tr '[:upper:]' '[:lower:]')

        if [[ "$PACKAGE_VERSION" == v* ]]; then
          echo "Stripping non-numeric leading character from version string ⚠️"
          PACKAGE_VERSION="${PACKAGE_VERSION:1}"
        fi

        echo "Searching index:   $INDEX_URL"
        echo "For package:       $PACKAGE_NAME $PACKAGE_VERSION"
        if [ "$PRE_RELEASE" = "true" ]; then
          echo "Including pre-release and development versions 💬"
        fi

        # Note: pip index is experimental and NOT fully supported
        # pip runs as in the step above: with the interpreter and PATH
        # it chose, without the working directory or PYTHONPATH on
        # sys.path at start-up, no user site in the workspace, and no
        # site-packages directory or .pth path in it
        settings="$("$PYTHON" -I -S "$PYTHONPATH_FILTER")"
        eval "$settings"
        if ! "$PYTHON" -S "$PYTHONPATH_FILTER" --check-site; then
          echo "python3 loads site-packages from the workspace ❌"; exit 1
        fi
        if [ "f$PRE_RELEASE" = "ftrue" ]; then
          # Additional flag to report development builds
          OUTPUT=$("$PYTHON" "$RUN_PIP" index --disable-pip-version-check \
              "--index-url=$INDEX_URL" versions --pre \
              "$PACKAGE_NAME" || true)
        else
          OUTPUT=$("$PYTHON" "$RUN_PIP" index --disable-pip-version-check \
            "--index-url=$INDEX_URL" versions \
            "$PACKAGE_NAME" || true)
        fi

        if [ -z "$OUTPUT" ]; then
          PACKAGE_MATCH="false"
          echo "Package $PACKAGE_NAME NOT found in index ❌"
          # Do not check package version when package is invalid
          unset PACKAGE_VERSION
          QUERY_ERROR="true"
        fi

        if (echo "$OUTPUT" |
          command -p grep "Available versions" >/dev/null 2>&1); then
           PACKAGE_MATCH="true"
           echo "Package $PACKAGE_NAME found in index ✅"
        fi

        VERSION_MATCH="untested"

        if [ -n "$PACKAGE_VERSION" ]; then
          VERSIONS=$(echo "$OUTPUT" | command -p grep 'Available versions' \
            | command -p sed "s/,//g" \
            | command -p sed "s/Available versions://")

           # Assume no match, then iterate over all reported versions
           VERSION_MATCH="false"
           for VERSION in $VERSIONS; do
             if [ "$VERSION" = "$PACKAGE_VERSION" ]; then
               # A package with the requested version was found
               VERSION_MATCH="true"
               break
             fi
           done
           if [ "$VERSION_MATCH" = "true" ]; then
              echo "Version $PACKAGE_VERSION was found in index ✅"
           else
              echo "Version $PACKAGE_VERSION was NOT found in index ❌"
              QUERY_ERROR="true"
           fi
        fi
        if [ "f$EXIT_ON_FAIL" = "ftrue" ] && [ "$QUERY_ERROR" = "true" ]; then
          echo "Error: a query failed to return results ❌"
          exit 1
        fi
        echo "package_match=$PACKAGE_MATCH" >> "$GITHUB_OUTPUT"
        echo "version_match=$VERSION_MATCH" >> "$GITHUB_OUTPUT"
