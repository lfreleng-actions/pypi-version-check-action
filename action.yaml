---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2024 The Linux Foundation

# pypi-version-check-action
name: "📦 PyPI Package Check"
description: "Checks PyPI for a given package (and optional build/release)"

inputs:
  # Mandatory
  PACKAGE_NAME:
    description: "Python package name"
    required: true
  # Optional
  PACKAGE_VERSION:
    # Leading "v" character will be automatically stripped
    description: "Package build/version/tag"
    required: false
  INDEX_URL:
    description: "Package index search URL"
    required: false
    default: 'https://pypi.org/simple'
  PRE_RELEASE:
    description: "Permit querying development and pre-release versions"
    required: false
    default: 'false'
  EXIT_ON_FAIL:
    description: "Exit with error on failure"
    required: false
    default: 'false'

outputs:
  PACKAGE_MATCH:
    description: "Set true when package exists in index"
    value: ${{ steps.check.outputs.package_match }}
  VERSION_MATCH:
    description: "Set true when web package/version exists"
    value: ${{ steps.check.outputs.version_match }}

runs:
  using: "composite"
  steps:
    # With UV_NO_MODIFY_PATH set, to any value, setup-uv leaves its own
    # binary off PATH but still starts a bare "uv python find", so the
    # caller's PATH would pick the uv that runs, ahead of every guard on
    # the next step. A step cannot unset an inherited variable: refuse.
    - name: "Refuse an inherited UV_NO_MODIFY_PATH"
      id: no-modify-path
      shell: bash
      run: |
        if [[ -n "${UV_NO_MODIFY_PATH+set}" ]]; then
          echo "::error title=Unsupported environment::UV_NO_MODIFY_PATH" \
            "is set, so setup-uv would start the first 'uv' on the" \
            "caller's PATH; unset it before this action ❌"
          exit 1
        fi

    # Runs in the action's own directory, so no uv setting in the
    # caller's checkout applies. setup-uv's one uv call here is "uv
    # python find", whose result it then executes; the caller's
    # environment can steer that lookup to a checkout interpreter in
    # many ways (VIRTUAL_ENV, CONDA_PREFIX, UV_PYTHON, internal
    # variables, macOS location variables). An invalid preference makes
    # uv refuse its arguments before any lookup, so nothing runs; setup-uv
    # then reports the Python version as unknown, which nothing here
    # reads. setup-uv adds directories to PATH for later steps, the
    # tool one taken from the caller's HOME or XDG_* settings unless
    # tool-bin-dir names it, so it names one this action owns: with the
    # uv and install directories, all of setup-uv's PATH entries are
    # then the action's, as the step above refuses UV_NO_MODIFY_PATH. An
    # inherited UV_PYTHON_ARCH would make setup-uv probe uv, which the
    # invalid preference fails; empty, setup-uv skips the probe.
    - name: "Install uv"
      id: setup-uv
      # yamllint disable-line rule:line-length
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      with:
        version-file: "${{ github.action_path }}/requirements/uv.txt"
        working-directory: "${{ github.action_path }}"
        tool-bin-dir: "${{ runner.temp }}/pypi-version-check-action/bin"
        enable-cache: false
      env:
        UV_NO_CONFIG: '1'
        UV_NO_PROJECT: '1'
        UV_PYTHON_PREFERENCE: 'lookup-disabled'
        UV_PYTHON_ARCH: ''
        UV_PYTHON_INSTALL_DIR: >-
          ${{ runner.temp }}/pypi-version-check-action/python

    # The interpreter is one uv installs, from its own pinned and
    # hash-checked builds, into a directory outside the workspace. uv
    # runs with an empty environment plus what it needs, so no caller
    # setting (PATH, VIRTUAL_ENV, CONDA_PREFIX, UV_*, PYTHON*) can pick
    # the interpreter; proxy and certificate settings pass through for
    # self-hosted runners. The path found must lie in the install
    # directory all the same.
    - name: "Install Python"
      id: python
      shell: bash
      working-directory: "${{ github.action_path }}"
      env:
        UV: "${{ steps.setup-uv.outputs.uv-path }}"
        INSTALL_DIR: "${{ runner.temp }}/pypi-version-check-action/python"
        CACHE_DIR: "${{ runner.temp }}/pypi-version-check-action/cache"
        PYTHON_VERSION: '3.13'
      run: |
        # Install Python
        clean=(UV_NO_CONFIG=1 UV_NO_PROJECT=1
          "UV_PYTHON_INSTALL_DIR=$INSTALL_DIR" "UV_CACHE_DIR=$CACHE_DIR")
        for name in HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy \
            https_proxy all_proxy no_proxy SSL_CERT_FILE SSL_CERT_DIR \
            UV_NATIVE_TLS; do
          if [ -n "${!name+set}" ]; then clean+=("$name=${!name}"); fi
        done
        env -i "${clean[@]}" "$UV" python install --quiet --no-bin \
          "$PYTHON_VERSION"
        PYTHON=$(env -i "${clean[@]}" "$UV" python find --managed-python \
          "$PYTHON_VERSION")
        case "$PYTHON" in
          "$INSTALL_DIR"/*) ;;
          *) echo "Error: uv found Python outside its install directory ❌"
             exit 1 ;;
        esac
        echo "path=$PYTHON" >> "$GITHUB_OUTPUT"

    # -I ignores PYTHON* variables and the user site and keeps the
    # working directory off sys.path; macOS reads the two location
    # variables even so, hence the unset.
    - name: "Check Python package index"
      id: check
      shell: bash
      working-directory: "${{ github.action_path }}"
      env:
        PYTHON: "${{ steps.python.outputs.path }}"
        INPUT_INDEX_URL: "${{ inputs.INDEX_URL }}"
        INPUT_PACKAGE_NAME: "${{ inputs.PACKAGE_NAME }}"
        INPUT_PACKAGE_VERSION: "${{ inputs.PACKAGE_VERSION }}"
        INPUT_PRE_RELEASE: "${{ inputs.PRE_RELEASE }}"
        INPUT_EXIT_ON_FAIL: "${{ inputs.EXIT_ON_FAIL }}"
      run: |
        # Check Python package index
        unset PYTHONEXECUTABLE __PYVENV_LAUNCHER__
        "$PYTHON" -I "$GITHUB_ACTION_PATH/scripts/check_index.py"
