---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Action Testing"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 4
    steps:
      - name: "Run Action: ${{ github.repository }} [valid package]"
        id: valid-package
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR

      - name: "Run Action: ${{ github.repository }} [valid package/version]"
        id: valid-version
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR
          package_version: 1.1.10

      # Note: test when version string prefixed with a "v" character
      # yamllint disable-line rule:line-length
      - name: "Run Action: ${{ github.repository }} [valid package/v-prefixed version]"
        id: v-prefixed-version
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR
          package_version: v1.1.10

      # yamllint disable-line rule:line-length
      - name: "Run Action: ${{ github.repository }} [valid package/invalid version]"
        id: invalid-version
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR
          package_version: 13.69.666

      # yamllint disable-line rule:line-length
      - name: "Run Action: ${{ github.repository }} [valid package/development version]"
        id: development-version
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: osc-github-devops
          package_version: 0.1.22.dev1
          pre_release: "true"

      # Check for invalid package and version
      - name: "Run Action: ${{ github.repository }} [invalid package/version]"
        id: invalid-package
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR-random-thing
          package_version: 13.69.666

      # Check a non-functioning/resolving repository URL
      - name: "Run Action: ${{ github.repository }} invalid repo [FAILURE]"
        id: invalid-repo
        uses: $/
        # Deliberately testing for failure
        continue-on-error: true
        with:
          # Invalid top-level domain will never resolve
          index_url: https://non.existent.ogfdhfdgrg/
          package_name: gremlin
          package_version: 13.69.666
          # Without this, an unreachable index only sets package_match
          exit_on_fail: "true"

      # Not querying pre-releases, expected to fail
      # yamllint disable-line rule:line-length
      - name: "Run Action: ${{ github.repository }} pre-releases not requested [FAILURE]"
        id: pre-release-not-requested
        uses: $/
        # Deliberately testing for failure
        continue-on-error: true
        with:
          index_url: https://test.pypi.org/simple
          package_name: osc-github-devops
          package_version: 0.1.22.dev1
          exit_on_fail: "true"

      # Check for invalid package and version
      # yamllint disable-line rule:line-length
      - name: "Run Action: ${{ github.repository }} invalid package/version [FAILURE]"
        id: invalid-package-exit
        uses: $/
        # Deliberately testing for failure
        continue-on-error: true
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR-random-thing
          package_version: 13.69.666
          exit_on_fail: "true"

      # Each step above passes whatever the action reports, so check the
      # results here. A failing case exits before writing its outputs,
      # leaving only its outcome to check.
      - name: "Verify action outputs and outcomes"
        shell: bash
        env:
          # Each case is "<PACKAGE_MATCH> <VERSION_MATCH>"
          VALID_PACKAGE: >-
            ${{ steps.valid-package.outputs.PACKAGE_MATCH }}
            ${{ steps.valid-package.outputs.VERSION_MATCH }}
          VALID_VERSION: >-
            ${{ steps.valid-version.outputs.PACKAGE_MATCH }}
            ${{ steps.valid-version.outputs.VERSION_MATCH }}
          V_PREFIXED_VERSION: >-
            ${{ steps.v-prefixed-version.outputs.PACKAGE_MATCH }}
            ${{ steps.v-prefixed-version.outputs.VERSION_MATCH }}
          INVALID_VERSION: >-
            ${{ steps.invalid-version.outputs.PACKAGE_MATCH }}
            ${{ steps.invalid-version.outputs.VERSION_MATCH }}
          DEVELOPMENT_VERSION: >-
            ${{ steps.development-version.outputs.PACKAGE_MATCH }}
            ${{ steps.development-version.outputs.VERSION_MATCH }}
          INVALID_PACKAGE: >-
            ${{ steps.invalid-package.outputs.PACKAGE_MATCH }}
            ${{ steps.invalid-package.outputs.VERSION_MATCH }}
          INVALID_REPO: ${{ steps.invalid-repo.outcome }}
          PRE_RELEASE_NOT_REQUESTED: >-
            ${{ steps.pre-release-not-requested.outcome }}
          INVALID_PACKAGE_EXIT: ${{ steps.invalid-package-exit.outcome }}
        run: |
          # Verify action outputs and outcomes
          FAILED=0
          check() {
            if [ "$3" = "$2" ]; then
              echo "$1: '$3' ✅"
            else
              echo "$1: expected '$2', got '$3' ❌"
              FAILED=1
            fi
          }
          check "valid package" "true untested" "$VALID_PACKAGE"
          check "valid package/version" "true true" "$VALID_VERSION"
          check "v-prefixed version" "true true" "$V_PREFIXED_VERSION"
          check "invalid version" "true false" "$INVALID_VERSION"
          check "development version" "true true" "$DEVELOPMENT_VERSION"
          check "invalid package" "false untested" "$INVALID_PACKAGE"
          check "invalid repo" "failure" "$INVALID_REPO"
          check "pre-releases not requested" "failure" \
            "$PRE_RELEASE_NOT_REQUESTED"
          check "invalid package, exit_on_fail" "failure" \
            "$INVALID_PACKAGE_EXIT"
          exit "$FAILED"

  ### Unit tests for scripts/check_index.py and the action's steps ###
  tests-unit:
    name: "Unit Tests"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: "requirements/uv.txt"
          python-version: "3.13"

      - name: "Run unit tests"
        shell: bash
        run: |
          # Run unit tests
          # Fail if uv.lock is stale, then install exactly what it pins
          uv lock --check
          uv sync --frozen
          uv run --frozen pytest -v

  ### The action against a workspace planted with Python and uv bait ###
  tests-isolation:
    name: "Workspace Isolation"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        # An explicit request (UV_PYTHON and kin) would mask discovery
        # of an active environment, so each runs on its own.
        selector: [request, active-environment]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 6
    steps:
      # Every bait records that it ran in a marker outside the workspace.
      # Relative PYTHONPATH and UV_* settings reach the action through
      # GITHUB_ENV, as a caller's earlier step would set them.
      - name: "Plant the workspace"
        shell: bash
        env:
          SELECTOR: ${{ matrix.selector }}
        run: |
          # Plant the workspace
          MARKER="$RUNNER_TEMP/bait-ran"
          echo "MARKER=$MARKER" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"
          bait="open('$MARKER', 'a').write(__file__ + '\\n')"
          mkdir -p .venv/bin .venv/conda-meta pkg/urllib home/lib/python3.13
          for module in json base64 sitecustomize usercustomize; do
            printf '%s\n' "$bait" > "pkg/$module.py"
          done
          printf '%s\n' "$bait" > pkg/urllib/__init__.py
          cp pkg/*.py .
          printf '#!/bin/sh\necho planted-tool-ran >> "%s"\nexit 1\n' \
            "$MARKER" > .venv/bin/python3
          chmod +x .venv/bin/python3
          for tool in python python3.13 uv; do
            cp .venv/bin/python3 ".venv/bin/$tool"
          done
          printf 'home = %s/.venv/bin\n' "$GITHUB_WORKSPACE" > .venv/pyvenv.cfg
          # setup-uv would add XDG_BIN_HOME to PATH for later steps
          mkdir -p xdg-bin
          for tool in env bash; do
            cp .venv/bin/python3 "xdg-bin/$tool"
          done
          printf '[tool.uv]\npython-preference = "only-system"\n' \
            > pyproject.toml
          printf 'python-downloads = "never"\n' > uv.toml
          echo '3.13' > .python-version
          venv="$GITHUB_WORKSPACE/.venv"
          {
            echo "PATH=$venv/bin:$PATH"
            echo "PYTHONPATH=pkg:."
            echo "PYTHONHOME=$GITHUB_WORKSPACE/home"
            echo "PYTHONUSERBASE=$GITHUB_WORKSPACE/pkg"
            echo "PYTHONSTARTUP=$GITHUB_WORKSPACE/json.py"
            echo "PYTHONEXECUTABLE=$venv/bin/python3"
            echo "__PYVENV_LAUNCHER__=$venv/bin/python3"
            echo "UV_PYTHON_INSTALL_MIRROR=https://127.0.0.1:9"
            # A fresh interpreter query on every uv call, cache or not
            echo "UV_NO_CACHE=1"
            # Would make setup-uv probe uv before installing it
            case "$(uname -m)" in
              arm64|aarch64) echo "UV_PYTHON_ARCH=aarch64" ;;
              *) echo "UV_PYTHON_ARCH=x86_64" ;;
            esac
            echo "XDG_BIN_HOME=$GITHUB_WORKSPACE/xdg-bin"
            if [ "$SELECTOR" = request ]; then
              echo "UV_PYTHON=$venv/bin/python3"
              echo "UV_PYTHON_SEARCH_PATH=$venv/bin"
              echo "UV_PYTHON_INSTALL_DIR=$venv"
              echo "UV_PYTHON_PREFERENCE=only-system"
            else
              echo "VIRTUAL_ENV=$venv"
              echo "CONDA_PREFIX=$venv"
              echo "CONDA_DEFAULT_ENV=base"
              echo "UV_INTERNAL__PARENT_INTERPRETER=$venv/bin/python3"
              echo "UV_INTERNAL__TEST_PYTHON_MANAGED=$venv/bin/python3"
              echo "UV_CACHE_DIR=$venv"
            fi
          } >> "$GITHUB_ENV"
          # Control: the bait is live for a Python that is not isolated
          PYTHONPATH=pkg python3 -c 'import json' || true
          if [ ! -s "$MARKER" ]; then
            echo "Control failed: planted modules did not run ❌"; exit 1
          fi
          rm "$MARKER"

      - name: "Run Action: ${{ github.repository }} [planted workspace]"
        id: planted
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR
          package_version: v1.1.10

      # The interpreter now exists, so a lookup that ran would find it:
      # the case an inherited location variable would redirect.
      - name: "Run Action: ${{ github.repository }} [planted, warm]"
        id: planted-warm
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR
          package_version: v1.1.10

      - name: "Verify no bait ran and the query worked"
        shell: bash
        env:
          RESULT: >-
            ${{ steps.planted.outputs.PACKAGE_MATCH }}
            ${{ steps.planted.outputs.VERSION_MATCH }}
            ${{ steps.planted-warm.outputs.PACKAGE_MATCH }}
            ${{ steps.planted-warm.outputs.VERSION_MATCH }}
        run: |
          # Verify no bait ran and the query worked
          if [ -e "$MARKER" ]; then
            echo "Planted code ran ❌"; cat "$MARKER"; exit 1
          fi
          case ":$PATH:" in
            *":$GITHUB_WORKSPACE/xdg-bin:"*)
              echo "The action put a checkout directory on PATH ❌"; exit 1 ;;
          esac
          if [ "$RESULT" != "true true true true" ]; then
            echo "Expected 'true true true true', got '$RESULT' ❌"; exit 1
          fi
          echo "No planted code ran; outputs '$RESULT' ✅"
