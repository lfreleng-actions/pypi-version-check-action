# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Action Testing"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 4
    steps:
      - name: "Run Action: ${{ github.repository }} [valid package]"
        id: valid-package
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR

      - name: "Run Action: ${{ github.repository }} [valid package/version]"
        id: valid-version
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR
          package_version: 1.1.10

      # Note: test when version string prefixed with a "v" character
      # yamllint disable-line rule:line-length
      - name: "Run Action: ${{ github.repository }} [valid package/v-prefixed version]"
        id: v-prefixed-version
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR
          package_version: v1.1.10

      # yamllint disable-line rule:line-length
      - name: "Run Action: ${{ github.repository }} [valid package/invalid version]"
        id: invalid-version
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR
          package_version: 13.69.666

      # yamllint disable-line rule:line-length
      - name: "Run Action: ${{ github.repository }} [valid package/development version]"
        id: development-version
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: osc-github-devops
          package_version: 0.1.22.dev1
          pre_release: "true"

      # Check for invalid package and version
      - name: "Run Action: ${{ github.repository }} [invalid package/version]"
        id: invalid-package
        uses: $/
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR-random-thing
          package_version: 13.69.666

      # Check a non-functioning/resolving repository URL
      - name: "Run Action: ${{ github.repository }} invalid repo [FAILURE]"
        id: invalid-repo
        uses: $/
        # Deliberately testing for failure
        continue-on-error: true
        with:
          # Invalid top-level domain will never resolve
          index_url: https://non.existent.ogfdhfdgrg/
          package_name: gremlin
          package_version: 13.69.666
          # Without this, an unreachable index only sets package_match
          exit_on_fail: "true"

      # Not querying pre-releases, expected to fail
      # yamllint disable-line rule:line-length
      - name: "Run Action: ${{ github.repository }} pre-releases not requested [FAILURE]"
        id: pre-release-not-requested
        uses: $/
        # Deliberately testing for failure
        continue-on-error: true
        with:
          index_url: https://test.pypi.org/simple
          package_name: osc-github-devops
          package_version: 0.1.22.dev1
          exit_on_fail: "true"

      # Check for invalid package and version
      # yamllint disable-line rule:line-length
      - name: "Run Action: ${{ github.repository }} invalid package/version [FAILURE]"
        id: invalid-package-exit
        uses: $/
        # Deliberately testing for failure
        continue-on-error: true
        with:
          index_url: https://test.pypi.org/simple
          package_name: ITR-random-thing
          package_version: 13.69.666
          exit_on_fail: "true"

      # Each step above passes whatever the action reports, so check the
      # results here. A failing case exits before writing its outputs,
      # leaving only its outcome to check.
      - name: "Verify action outputs and outcomes"
        shell: bash
        env:
          # Each case is "<PACKAGE_MATCH> <VERSION_MATCH>"
          VALID_PACKAGE: >-
            ${{ steps.valid-package.outputs.PACKAGE_MATCH }}
            ${{ steps.valid-package.outputs.VERSION_MATCH }}
          VALID_VERSION: >-
            ${{ steps.valid-version.outputs.PACKAGE_MATCH }}
            ${{ steps.valid-version.outputs.VERSION_MATCH }}
          V_PREFIXED_VERSION: >-
            ${{ steps.v-prefixed-version.outputs.PACKAGE_MATCH }}
            ${{ steps.v-prefixed-version.outputs.VERSION_MATCH }}
          INVALID_VERSION: >-
            ${{ steps.invalid-version.outputs.PACKAGE_MATCH }}
            ${{ steps.invalid-version.outputs.VERSION_MATCH }}
          DEVELOPMENT_VERSION: >-
            ${{ steps.development-version.outputs.PACKAGE_MATCH }}
            ${{ steps.development-version.outputs.VERSION_MATCH }}
          INVALID_PACKAGE: >-
            ${{ steps.invalid-package.outputs.PACKAGE_MATCH }}
            ${{ steps.invalid-package.outputs.VERSION_MATCH }}
          INVALID_REPO: ${{ steps.invalid-repo.outcome }}
          PRE_RELEASE_NOT_REQUESTED: >-
            ${{ steps.pre-release-not-requested.outcome }}
          INVALID_PACKAGE_EXIT: ${{ steps.invalid-package-exit.outcome }}
        run: |
          # Verify action outputs and outcomes
          FAILED=0
          check() {
            if [ "$3" = "$2" ]; then
              echo "$1: '$3' ✅"
            else
              echo "$1: expected '$2', got '$3' ❌"
              FAILED=1
            fi
          }
          check "valid package" "true untested" "$VALID_PACKAGE"
          check "valid package/version" "true true" "$VALID_VERSION"
          check "v-prefixed version" "true true" "$V_PREFIXED_VERSION"
          check "invalid version" "true false" "$INVALID_VERSION"
          check "development version" "true true" "$DEVELOPMENT_VERSION"
          check "invalid package" "false untested" "$INVALID_PACKAGE"
          check "invalid repo" "failure" "$INVALID_REPO"
          check "pre-releases not requested" "failure" \
            "$PRE_RELEASE_NOT_REQUESTED"
          check "invalid package, exit_on_fail" "failure" \
            "$INVALID_PACKAGE_EXIT"
          exit "$FAILED"

  ### Unit cover for issue #150: the pip fallback on a pip-free PATH ###
  tests-pip-fallback:
    name: "Test pip Fallback"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.13"

      - name: "Run pip fallback tests"
        shell: bash
        run: |
          # Run pip fallback tests
          # Fail if uv.lock is stale, then install exactly what it pins
          uv lock --check
          uv sync --frozen
          uv run --frozen pytest -v
